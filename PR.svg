<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 90" width="640" height="360" shape-rendering="crispEdges"><style>text{font:bold 9px monospace;fill:#fff}.k{font:7px sans-serif;fill:#ddd}
@keyframes atk{0%,100%{transform:translate(0,0)}40%{transform:translate(28px,0)}}
@keyframes crit{0%,100%{opacity:1}20%,60%{opacity:.2}}
@keyframes dodge{0%,100%{transform:translate(0,0)}40%{transform:translate(-22px,-14px)}}
@keyframes hit{0%,100%{transform:translate(0,0)}20%{transform:translate(-3px,0)}40%{transform:translate(3px,0)}60%{transform:translate(-3px,0)}}
@keyframes ko{0%{transform:rotate(0)}50%,100%{transform:rotate(90deg)}}
@keyframes oops{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes run{0%{transform:translate(0,0)}100%{transform:translate(-120px,0)}}
@keyframes up{0%{transform:translate(0,0);opacity:1}100%{transform:translate(0,-40px);opacity:0}}
@keyframes fade{0%{opacity:0}100%{opacity:.85}}
.m{transform-box:fill-box;transform-origin:center bottom;animation:1.2s steps(6) infinite}</style><rect width="160" height="90" fill="#1a1420"/><rect y="66" width="160" height="24" fill="#2a2118"/><g style="animation:run 1.5s steps(10) infinite"><rect x="120" y="54" width="8" height="12" fill="#c9c9d6"/><rect x="132" y="54" width="8" height="12" fill="#2f8f8a"/><rect x="144" y="54" width="8" height="12" fill="#5aa35a"/></g><text x="6" y="12">PR</text><text class="k" x="6" y="84">TEST · 도주</text></svg>